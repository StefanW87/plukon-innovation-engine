// ── RangeSlider ────────────────────────────────────────────────────────────
function RangeSlider({label,min,max,step,valueMin,valueMax,onChange,unit}){
  const trackRef=useRef(null),dragging=useRef(null);
  const pct=v=>((v-min)/(max-min))*100;
  const snap=v=>Math.round(v/step)*step;
  const clamp=(v,lo,hi)=>Math.min(Math.max(v,lo),hi);
  const valFromEvent=e=>{const rect=trackRef.current.getBoundingClientRect();const cx=e.touches?e.touches[0].clientX:e.clientX;return snap(min+clamp((cx-rect.left)/rect.width,0,1)*(max-min));};
  const onPD=which=>e=>{e.preventDefault();dragging.current=which;const move=ev=>{const v=valFromEvent(ev);if(dragging.current==="min"&&v<valueMax)onChange(v,valueMax);if(dragging.current==="max"&&v>valueMin)onChange(valueMin,v);};const up=()=>{dragging.current=null;window.removeEventListener("mousemove",move);window.removeEventListener("mouseup",up);window.removeEventListener("touchmove",move);window.removeEventListener("touchend",up);};window.addEventListener("mousemove",move);window.addEventListener("mouseup",up);window.addEventListener("touchmove",move,{passive:false});window.addEventListener("touchend",up);};
  const minP=pct(valueMin),maxP=pct(valueMax);
  const dMin=unit==="EUR"?("EUR"+valueMin.toFixed(2)):(valueMin+unit);
  const dMax=unit==="EUR"?("EUR"+valueMax.toFixed(2)):(valueMax+unit);
  return(
    <div style={{marginBottom:"8px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}}>
        <p style={{fontSize:"11px",fontWeight:"700",color:G,fontFamily:"'Nunito',sans-serif",letterSpacing:"0.07em",textTransform:"uppercase",margin:0}}>{label}</p>
        <span style={{fontSize:"14px",fontWeight:"800",color:G,fontFamily:"'Nunito',sans-serif",background:GL,padding:"3px 12px",borderRadius:"20px"}}>{dMin+" - "+dMax}</span>
      </div>
      <div ref={trackRef} style={{position:"relative",height:"6px",background:"#E0E0E0",borderRadius:"3px",margin:"16px 0 8px"}}>
        <div style={{position:"absolute",left:(minP+"%"),right:((100-maxP)+"%"),height:"100%",background:G,borderRadius:"3px"}}/>
        <div onMouseDown={onPD("min")} onTouchStart={onPD("min")} style={{position:"absolute",left:(minP+"%"),top:"50%",transform:"translate(-50%,-50%)",width:"22px",height:"22px",borderRadius:"50%",background:G,boxShadow:"0 2px 8px rgba(0,140,52,0.4)",cursor:"grab",zIndex:3,touchAction:"none"}}/>
        <div onMouseDown={onPD("max")} onTouchStart={onPD("max")} style={{position:"absolute",left:(maxP+"%"),top:"50%",transform:"translate(-50%,-50%)",width:"22px",height:"22px",borderRadius:"50%",background:G,boxShadow:"0 2px 8px rgba(0,140,52,0.4)",cursor:"grab",zIndex:3,touchAction:"none"}}/>
      </div>
    </div>
  );
}

// ── parseConcept ────────────────────────────────────────────────────────────
function parseConcept(concept,index,lang){
  const lines=concept.split("\n").filter(Boolean);
  const titleLine=lines[0]?.replace(/^#+\s*/,"").replace(/\*\*/g,"")||("Concept "+(index+1));
  const sep=titleLine.includes(" - ")?" - ":titleLine.includes(" — ")?" — ":null;
  const [titleName,tagline]=sep?[titleLine.split(sep)[0],titleLine.split(sep).slice(1).join(sep)]:[titleLine,""];
  const secNamesEN=["Summary","Target consumer","Ingredients","Nutrition","Specs","Trends","Retail fit","Feasibility","Considerations","Market position"];
  const secNamesNL=["Samenvatting","Doelconsument","Ingredienten","Nutritie","Specs","Trends","Retailfit","Haalbaarheid","Aandachtspunten","Marktpositie"];
  const sectionNames=lang==="en"?secNamesEN:secNamesNL;
  const allNames=[
    ...secNamesEN,...secNamesNL,
    "Ingrediënten","Ingredienten","INGREDIENTEN","INGREDIËNTEN",
    "Samenvatting","SAMENVATTING","Doelconsument","DOELCONSUMENT",
    "Nutritie","NUTRITIE","Specs","SPECS","Trends","TRENDS",
    "Retailfit","RETAILFIT","Retail fit","RETAIL FIT",
    "Haalbaarheid","HAALBAARHEID","Aandachtspunten","AANDACHTSPUNTEN",
    "Marktpositie","MARKTPOSITIE","Market position","MARKET POSITION",
    "Summary","SUMMARY","Target consumer","TARGET CONSUMER",
    "Ingredients","INGREDIENTS","Nutrition","NUTRITION",
    "Feasibility","FEASIBILITY","Considerations","CONSIDERATIONS",
  ];
  const EN_TO_NL_MAP={"summary":"Samenvatting","target consumer":"Doelconsument","ingredients":"Ingredienten","nutrition":"Nutritie","specs":"Specs","trends":"Trends","retail fit":"Retailfit","feasibility":"Haalbaarheid","considerations":"Aandachtspunten","market position":"Marktpositie"};
  const NL_TO_EN_MAP={"samenvatting":"Summary","doelconsument":"Target consumer","ingredienten":"Ingredients","ingrediënten":"Ingredients","nutritie":"Nutrition","specs":"Specs","trends":"Trends","retailfit":"Retail fit","haalbaarheid":"Feasibility","aandachtspunten":"Considerations","marktpositie":"Market position"};
  const sections={};let cur=null,curLines=[];
  lines.slice(1).forEach(line=>{
    const clean=line.replace(/\*\*/g,"").replace(/^#+\s*/,"").trim();
    const cleanLow=clean.toLowerCase();
    const matched=allNames.find(n=>n.toLowerCase()===cleanLow);
    if(matched){
      if(cur)sections[cur]=curLines.join("\n").trim();
      let canon;
      if(lang==="en"){canon=NL_TO_EN_MAP[cleanLow]||sectionNames.find(n=>n.toLowerCase()===cleanLow)||matched;}
      else{canon=EN_TO_NL_MAP[cleanLow]||sectionNames.find(n=>n.toLowerCase()===cleanLow)||matched;}
      cur=canon;curLines=[];
    }
    else if(cur)curLines.push(line);
  });
  if(cur)sections[cur]=curLines.join("\n").trim();
  const summary=sections[sectionNames[0]]||Object.values(sections)[0]||"";
  const usps=summary.split(/\.\s+/).filter(s=>s.trim().length>10).slice(0,3).map(s=>s.replace(/\*\*/g,"").replace(/\.+$/,"").trim()+".");
  const specsText=sections["Specs"]||"";
  const nutriText=sections[sectionNames[3]]||sections["Nutritie"]||sections["Nutrition"]||"";
  const grammage=(specsText.match(/[Gg]rammage[:\s]+([^\n,]+)/)||[])[1]?.trim()||"";
  const prijsMatch=specsText.match(/(?:[Pp]rijs|[Pp]rice)[:\s]+((?:EUR|[€])[\d,.]+(?:\s*[-]\s*(?:EUR|[€])[\d,.]+)?)/);
  const prijs=prijsMatch?prijsMatch[1]:(specsText.match(/((?:EUR|[€])[\d,.]+)/)||[])[1]||"";
  const eiwit=(nutriText.match(/(?:[Ee]iwit|[Pp]rotein)[:\s]+([\d,.]+\s*g)/)||[])[1]||"";
  const nutriscore=(nutriText.match(/[Nn]utriscore[:\s]*([A-E])/)||[])[1]||"";
  const cleanTitle=titleName.replace(/[^a-zA-Z0-9 ]/g," ").trim().slice(0,50);
  const imgQ=encodeURIComponent("professional food photography "+cleanTitle+" fresh colorful plate studio lighting overhead");
  const makeImgUrl=seed=>"https://image.pollinations.ai/prompt/"+imgQ+"?width=700&height=460&nologo=true&seed="+seed+"&enhance=true";
  return{titleName:titleName.trim(),tagline:(tagline||"").trim(),sections,sectionNames,usps,grammage,prijs,eiwit,nutriscore,makeImgUrl};
}

    w.document.write('const DATA='+JSON.stringify({

    w.document.write('function generatePPTX(){');

    w.document.write('}');

  const printPDF=()=>{

    if(p.nutriscore)w.document.write('<div><span>Nutriscore </span>'+p.nutriscore+'</div>');

    w.document.write('<div class="footer"><span>Plukon Innovation Engine v4.1</span><span>'+new Date().toLocaleDateString('nl-NL')+'</span></div></body></html>');
    w.document.close();setTimeout(()=>w.print(),600);
  };

    return text.split("\n").map((line,i)=>{

      const clean=line.replace(/^[-*]\s*/,"").replace(/\*\*/g,"").trim();

      return <p key={i} style={{margin:"4px 0",fontSize:"13px",color:"#444",lineHeight:"1.7",paddingLeft:isBullet?"12px":"0"}}>{isBullet?"- "+clean:clean}</p>;
    });
  };

  const nsColor={A:"#00843D",B:"#85BB2F",C:"#FFCC00",D:"#FF6600",E:"#E63312"}[p.nutriscore];

  return(
    <div style={{background:"#fff",borderRadius:"16px",overflow:"hidden",marginBottom:"20px",boxShadow:"0 4px 24px rgba(0,0,0,0.08)",border:"1px solid #e8e4df",animation:"fadeUp 0.4s ease"}}>

        <div style={{position:"absolute",top:"14px",left:"14px",display:"flex",gap:"8px"}}>
          <span style={{background:O,color:"#fff",borderRadius:"8px",padding:"4px 12px",fontSize:"12px",fontWeight:"900",fontFamily:"'Nunito',sans-serif"}}>{"NPC "+(String(index+1).padStart(2,"0"))}</span>
          {p.nutriscore&&<span style={{background:nsColor||"#999",color:p.nutriscore==="C"?"#333":"#fff",borderRadius:"8px",padding:"4px 10px",fontSize:"11px",fontWeight:"900",fontFamily:"'Nunito',sans-serif"}}>{"NUTRI-SCORE "+p.nutriscore}</span>}
        </div>
        <div style={{position:"absolute",bottom:"14px",left:"16px",right:"16px"}}>
          <h3 style={{color:"#1a1a1a",fontFamily:"'Nunito',sans-serif",fontWeight:"900",fontSize:"20px",margin:"0 0 3px"}}>{p.titleName}</h3>
          {p.tagline&&<p style={{color:"#555",fontFamily:"'Nunito',sans-serif",fontSize:"13px",margin:0,fontStyle:"italic"}}>{p.tagline}</p>}
        </div>
      </div>
      <div style={{display:"flex",borderBottom:"1px solid #f0f7f0"}}>
        {[[lang==="en"?"Price":"Prijs",p.prijs||"-"],[lang==="en"?"Grammage":"Grammage",p.grammage||"-"],[lang==="en"?"Protein":"Eiwit",p.eiwit||"-"],["Nutri-Score",p.nutriscore||"-"]].map(([lbl,val],i)=>(
          <div key={i} style={{flex:1,padding:"10px 6px",textAlign:"center",borderRight:i<3?"1px solid #f0f7f0":"none"}}>
            <div style={{fontSize:"10px",color:"#aaa",fontFamily:"'Nunito',sans-serif",fontWeight:"700",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:"3px"}}>{lbl}</div>
            <div style={{fontSize:"13px",color:G,fontFamily:"'Nunito',sans-serif",fontWeight:"800"}}>{val}</div>
          </div>
        ))}
      </div>
      <div style={{padding:"16px 20px",borderBottom:"1px solid #f0f7f0"}}>
        <p style={{margin:"0 0 10px",fontSize:"11px",fontWeight:"900",color:G,fontFamily:"'Nunito',sans-serif",letterSpacing:"0.08em",textTransform:"uppercase"}}>USP</p>
        {p.usps.map((usp,i)=>(
          <div key={i} style={{display:"flex",gap:"10px",alignItems:"flex-start",marginBottom:"7px"}}>
            <div style={{width:"22px",height:"22px",borderRadius:"50%",background:GL,border:"2px solid "+G,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:"1px"}}>
              <span style={{color:G,fontSize:"11px",fontWeight:"900"}}>{i+1}</span>
            </div>
            <p style={{margin:0,fontSize:"13px",color:"#333",fontFamily:"'Nunito',sans-serif",lineHeight:"1.6"}}>{usp}</p>
          </div>
        ))}
      </div>
      <div style={{padding:"10px 16px",display:"flex",gap:"8px",flexWrap:"wrap",borderBottom:"1px solid #f0f7f0",background:"#fafafa"}} className="no-print">
        <button onClick={()=>onSave(concept)} style={{padding:"7px 14px",background:saved?"#f0f0f0":GL,color:saved?"#aaa":G,border:"1.5px solid "+(saved?"#ddd":G),borderRadius:"8px",cursor:saved?"default":"pointer",fontSize:"12px",fontWeight:"700",fontFamily:"'Nunito',sans-serif"}}>{saved?(lang==="en"?"Saved":"Opgeslagen"):(lang==="en"?"Save":"Opslaan")}</button>

        {isAH&&<button onClick={exportAH} style={{padding:"7px 14px",background:"#00A3E0",color:"#fff",border:"none",borderRadius:"8px",cursor:"pointer",fontSize:"12px",fontWeight:"700",fontFamily:"'Nunito',sans-serif"}}>AH format</button>}
      </div>

          <textarea value={devFeedback} onChange={e=>setDevFeedback(e.target.value)} placeholder={lang==="en"?"e.g. more premium, Korean flavour, lower price...":"bijv. meer premium, richting Koreaans, lagere prijs..."} style={{width:"100%",minHeight:"80px",background:"#fff",border:"1.5px solid #FFD0A0",borderRadius:"8px",color:"#333",padding:"10px 12px",fontSize:"13px",fontFamily:"'Nunito',sans-serif",resize:"vertical",outline:"none",lineHeight:"1.6",boxSizing:"border-box"}}/>
          <button onClick={()=>{onDevelop(concept,devFeedback);setShowDev(false);setDevFeedback("");}} disabled={!devFeedback.trim()||developing} style={{marginTop:"8px",padding:"9px 18px",background:!devFeedback.trim()||developing?"#ccc":O,color:"#fff",border:"none",borderRadius:"8px",cursor:"pointer",fontSize:"13px",fontWeight:"700",fontFamily:"'Nunito',sans-serif"}}>{developing?(lang==="en"?"Generating...":"Genereren..."):(lang==="en"?"Generate improved version":"Genereer verbeterde versie")}</button>
        </div>
      )}
      <div onClick={()=>setOpen(!open)} style={{padding:"11px 20px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",background:"#fafafa"}}>
        <span style={{fontSize:"12px",fontWeight:"800",color:G,fontFamily:"'Nunito',sans-serif",letterSpacing:"0.05em",textTransform:"uppercase"}}>{open?(lang==="en"?"Hide details":"Verberg details"):(lang==="en"?"View full analysis":"Bekijk volledige analyse")}</span>
        <span style={{color:G}}>{open?"▲":"▼"}</span>
      </div>
      {open&&<div style={{padding:"20px"}}>{p.sectionNames.map(sec=><div key={sec} style={{marginBottom:"16px",paddingBottom:"16px",borderBottom:"1px solid #f5f9f5"}}><p style={{margin:"0 0 6px",fontSize:"11px",fontWeight:"900",color:G,fontFamily:"'Nunito',sans-serif",letterSpacing:"0.08em",textTransform:"uppercase"}}>{sec}</p><div>{renderSection(p.sections[sec])}</div></div>)}</div>}
    </div>
  );
}

// ── ImprovementCard ─────────────────────────────────────────────────────────
function ImprovementCard({concept,index,lang,onSave,saved}){
  const lines=concept.split("\n").filter(Boolean);
  const titleLine=lines[0]?.replace(/^#+\s*/,"").replace(/\*\*/g,"").trim()||("Richting "+(index+1));
  const sep=titleLine.includes(" - ")?" - ":titleLine.includes(" — ")?" — ":null;
  const [titleName,subtitle]=sep?[titleLine.split(sep)[0].trim(),titleLine.split(sep).slice(1).join(sep).trim()]:[titleLine,""];

  const IMP_SECTIONS_NL=["Aanleiding & doel","Grondstofvoorstel","Mengverhouding & receptuurwijziging","Impact op sensorisch profiel","Productietechnische haalbaarheid","Testvoorstel","Kostprijsimpact","Impact voor sales & klant","Impact voor product management","Advies & prioriteit"];
  const IMP_SECTIONS_EN=["Rationale & goal","Ingredient proposal","Mixing ratio & recipe change","Impact on sensory profile","Production feasibility","Test proposal","Cost price impact","Impact for sales & customer","Impact for product management","Advice & priority"];
  const allSecs=[...IMP_SECTIONS_NL,...IMP_SECTIONS_EN,
    "AANLEIDING & DOEL","GRONDSTOFVOORSTEL","MENGVERHOUDING & RECEPTUURWIJZIGING",
    "IMPACT OP SENSORISCH PROFIEL","PRODUCTIETECHNISCHE HAALBAARHEID","TESTVOORSTEL",
    "KOSTPRIJSIMPACT","IMPACT VOOR SALES & KLANT","IMPACT VOOR PRODUCT MANAGEMENT","ADVIES & PRIORITEIT",
    "Wat verandert er","Waarom","Impact","Behoud","Haalbaarheid","Vervolgstap","Aanbeveling",
  ];

  const sections={};let cur=null,curLines=[];
  lines.slice(1).forEach(line=>{
    const clean=line.replace(/\*\*/g,"").replace(/^#+\s*/,"").trim();
    const matched=allSecs.find(n=>n.toLowerCase()===clean.toLowerCase());
    if(matched){if(cur)sections[cur]=curLines.join("\n").trim();cur=matched;curLines=[];}
    else if(cur)curLines.push(line);
  });
  if(cur)sections[cur]=curLines.join("\n").trim();

  const sectionOrder=lang==="en"?IMP_SECTIONS_EN:IMP_SECTIONS_NL;
  const foundSections=Object.keys(sections);
  const orderedSections=[...sectionOrder.filter(s=>foundSections.some(f=>f.toLowerCase()===s.toLowerCase())),...foundSections.filter(f=>!sectionOrder.some(s=>s.toLowerCase()===f.toLowerCase()))];

  const copyText=()=>{navigator.clipboard.writeText(concept).then(()=>alert(lang==="en"?"Copied!":"Gekopieerd!"));};

  const colors=["#E8F5EE","#FFF3E0","#E3F2FD","#F3E5F5","#FBE9E7","#F0F4C3"];
  const bg=colors[index%colors.length];

  return(
    <div style={{background:"#fff",borderRadius:"16px",overflow:"hidden",marginBottom:"20px",boxShadow:"0 4px 24px rgba(0,0,0,0.08)",border:"1px solid #e8e4df",animation:"fadeUp 0.4s ease"}}>
      <div style={{background:bg,padding:"20px 24px",borderBottom:"1px solid #e8e4df"}}>
        <div style={{display:"flex",alignItems:"center",gap:"12px",marginBottom:"6px"}}>
          <span style={{background:O,color:"#fff",borderRadius:"8px",padding:"4px 12px",fontSize:"12px",fontWeight:"900",fontFamily:"'Nunito',sans-serif"}}>{"RICHTING "+(String(index+1).padStart(2,"0"))}</span>
        </div>
        <h3 style={{color:"#1a1a1a",fontFamily:"'Nunito',sans-serif",fontWeight:"900",fontSize:"19px",margin:"0 0 3px"}}>{titleName}</h3>
        {subtitle&&<p style={{color:"#555",fontFamily:"'Nunito',sans-serif",fontSize:"13px",margin:0,fontStyle:"italic"}}>{subtitle}</p>}
      </div>
      <div style={{padding:"8px 16px",display:"flex",gap:"8px",flexWrap:"wrap",borderBottom:"1px solid #f0f7f0",background:"#fafafa"}} className="no-print">
        <button onClick={()=>onSave(concept)} style={{padding:"7px 14px",background:saved?"#f0f0f0":GL,color:saved?"#aaa":G,border:"1.5px solid "+(saved?"#ddd":G),borderRadius:"8px",cursor:saved?"default":"pointer",fontSize:"12px",fontWeight:"700",fontFamily:"'Nunito',sans-serif"}}>{saved?(lang==="en"?"Saved":"Opgeslagen"):(lang==="en"?"Save":"Opslaan")}</button>
        <button onClick={copyText} style={{padding:"7px 14px",background:"#fff",color:"#555",border:"1.5px solid #ddd",borderRadius:"8px",cursor:"pointer",fontSize:"12px",fontWeight:"700",fontFamily:"'Nunito',sans-serif"}}>{lang==="en"?"Copy":"Kopieer"}</button>
      </div>
      <div style={{padding:"20px"}}>
        {orderedSections.length>0?orderedSections.map(sec=>{
          const val=sections[sec]||sections[Object.keys(sections).find(k=>k.toLowerCase()===sec.toLowerCase())||""]||"";
          if(!val)return null;
          return(
            <div key={sec} style={{marginBottom:"16px",paddingBottom:"16px",borderBottom:"1px solid #f5f9f5"}}>
              <p style={{margin:"0 0 6px",fontSize:"11px",fontWeight:"900",color:G,fontFamily:"'Nunito',sans-serif",letterSpacing:"0.08em",textTransform:"uppercase"}}>{sec}</p>
              <div>{val.split("\n").filter(Boolean).map((line,i)=>{
                const isBullet=/^[-*]/.test(line.trim());
                const clean=line.replace(/^[-*]\s*/,"").replace(/\*\*/g,"").trim();
                return clean?<p key={i} style={{margin:"4px 0",fontSize:"13px",color:"#444",lineHeight:"1.7",paddingLeft:isBullet?"12px":"0"}}>{isBullet?"- "+clean:clean}</p>:null;
              })}</div>
            </div>
          );
        }):(
          <div>
            {lines.slice(1).filter(Boolean).map((line,i)=>{
              const isHeader=/^\*\*[^*]+\*\*$/.test(line.trim())||/^#+\s/.test(line.trim());
              const clean=line.replace(/\*\*/g,"").replace(/^#+\s*/,"").trim();
              if(!clean)return null;
              if(isHeader)return <p key={i} style={{margin:"16px 0 4px",fontSize:"11px",fontWeight:"900",color:G,fontFamily:"'Nunito',sans-serif",letterSpacing:"0.08em",textTransform:"uppercase"}}>{clean}</p>;

// ── RotatingFact ────────────────────────────────────────────────────────────
function RotatingFact({lang}){
  const {useState:uS,useEffect:uE}=React;
  const [idx,setIdx]=uS(()=>Math.floor(Math.random()*WEETJES.length));
  const [visible,setVisible]=uS(true);
  uE(()=>{
    const iv=setInterval(()=>{
      setVisible(false);
      setTimeout(()=>{setIdx(i=>(i+1)%WEETJES.length);setVisible(true);},400);
    },8000);
    return()=>clearInterval(iv);
  },[]);
  return(
    <div style={{minHeight:"80px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",margin:"0 0 8px"}}>
      <p style={{fontSize:"11px",fontWeight:"700",color:"#F57C00",fontFamily:"'Nunito',sans-serif",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"8px"}}>
        {lang==="en"?"Did you know?":"Wist je dat..."}
      </p>
      <p style={{color:"#555",fontSize:"13px",fontFamily:"'Nunito',sans-serif",lineHeight:"1.6",maxWidth:"460px",opacity:visible?1:0,transition:"opacity 0.4s ease"}}>
        {WEETJES[idx]}
      </p>
    </div>
  );
}

            return(
              <div key={s.id} style={{display:"flex",alignItems:"center",gap:"10px",padding:"9px 10px",borderRadius:"8px",marginBottom:"2px",background:isActive?"rgba(0,140,52,0.18)":"transparent",transition:"all 0.15s"}}>
                <div style={{width:"22px",height:"22px",borderRadius:"50%",background:isDone?G:isActive?"rgba(0,140,52,0.3)":"rgba(255,255,255,0.07)",border:"1.5px solid "+(isDone?G:isActive?G+"80":"rgba(255,255,255,0.12)"),display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all 0.2s"}}>
                  <span style={{fontSize:"11px",color:isDone?"#fff":isActive?"#4ade80":"rgba(255,255,255,0.25)",fontWeight:"700",fontFamily:"'Nunito',sans-serif"}}>{isDone?"v":(i+1)}</span>
                </div>
                <span style={{fontSize:"12px",color:isActive?"#fff":isDone?"rgba(255,255,255,0.55)":"rgba(255,255,255,0.25)",fontWeight:isActive?"700":"500",fontFamily:"'Nunito',sans-serif",transition:"all 0.15s"}}>{s.label}</span>
                {isActive&&<div style={{marginLeft:"auto",width:"6px",height:"6px",borderRadius:"50%",background:"#4ade80"}}/>}
              </div>
            );
          })}
          <div style={{height:"1px",background:"rgba(255,255,255,0.05)",margin:"16px 8px"}}/>
          <div style={{fontSize:"10px",color:"rgba(255,255,255,0.25)",letterSpacing:"0.08em",padding:"0 10px",marginBottom:"8px",textTransform:"uppercase",fontFamily:"'Nunito',sans-serif",fontWeight:"700"}}>{T("Modi","Modes",lang)}</div>
          {[{id:"import",icon:"📋",nl:"Briefing importeren",en:"Import briefing"},{id:"tasting",icon:"🧪",nl:"Tasting feedback",en:"Tasting feedback"}].map(m=>(
            <div key={m.id} onClick={()=>{set1("conceptType",m.id);setStep(0);setDone([]);}} style={{display:"flex",alignItems:"center",gap:"10px",padding:"9px 10px",borderRadius:"8px",marginBottom:"2px",cursor:"pointer",background:form.conceptType===m.id&&phase==="steps"?"rgba(245,124,0,0.12)":"transparent",transition:"all 0.15s"}}>
              <span style={{fontSize:"14px"}}>{m.icon}</span>
              <span style={{fontSize:"12px",color:"rgba(255,255,255,0.35)",fontFamily:"'Nunito',sans-serif"}}>{lang==="en"?m.en:m.nl}</span>
            </div>
          ))}
        </div>
        <div style={{padding:"12px 8px",borderTop:"0.5px solid rgba(255,255,255,0.05)"}}>
          {[{icon:"↩",nl:"Nieuwe briefing",en:"New briefing",action:reset},{icon:"💾",nl:"Bibliotheek ("+(savedConcepts.length)+")",en:"Library ("+(savedConcepts.length)+")",action:()=>setShowLibrary(!showLibrary)},{icon:"🔑",nl:"API Key",en:"API Key",action:()=>{localStorage.removeItem("plukon_api_key");setApiKey("");}},{icon:"🌐",nl:lang==="en"?"EN":"NL",en:lang==="en"?"EN":"NL",action:()=>setLang("")}].map((item,i)=>(
            <div key={i} onClick={item.action} style={{display:"flex",alignItems:"center",gap:"8px",padding:"8px 10px",borderRadius:"8px",cursor:"pointer",marginBottom:"2px"}} onMouseOver={e=>e.currentTarget.style.background="rgba(255,255,255,0.05)"} onMouseOut={e=>e.currentTarget.style.background="transparent"}>
              <span style={{fontSize:"14px"}}>{item.icon}</span>
              <span style={{fontSize:"12px",color:"rgba(255,255,255,0.25)",fontFamily:"'Nunito',sans-serif"}}>{lang==="en"?item.en:item.nl}</span>
            </div>
          ))}
        </div>
      </div>

      {/* LIBRARY OVERLAY */}
      {showLibrary&&(
        <div style={{position:"fixed",top:0,left:"232px",bottom:0,width:"360px",background:"#fff",zIndex:200,boxShadow:"4px 0 24px rgba(0,0,0,0.15)",display:"flex",flexDirection:"column",animation:"slideIn 0.2s ease"}} className="no-print">
          <div style={{padding:"20px 20px 16px",borderBottom:"0.5px solid #e8e4df",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div>
              <h2 style={{fontSize:"16px",fontWeight:"900",color:"#1a1a1a",fontFamily:"'Nunito',sans-serif",margin:"0 0 2px"}}>Opgeslagen concepten</h2>
              <p style={{fontSize:"12px",color:"#aaa",fontFamily:"'Nunito',sans-serif",margin:0}}>{savedConcepts.length+" concept"+(savedConcepts.length!==1?"en":"")+" · bewaard in browser"}</p>
            </div>
            <button onClick={()=>setShowLibrary(false)} style={{background:"none",border:"none",fontSize:"22px",color:"#aaa",cursor:"pointer",padding:"4px"}}>×</button>
          </div>
          <div style={{flex:1,overflowY:"auto",padding:"16px"}}>
            {savedConcepts.length===0?(
              <div style={{textAlign:"center",padding:"40px 20px"}}>
                <div style={{fontSize:"40px",marginBottom:"12px"}}>💾</div>
                <p style={{fontSize:"13px",color:"#aaa",fontFamily:"'Nunito',sans-serif"}}>Nog geen opgeslagen concepten. Klik "Opslaan" bij een concept om het hier te bewaren.</p>
              </div>
            ):(
              savedConcepts.map(s=>(
                <div key={s.id} style={{background:SAND,borderRadius:"10px",padding:"14px",marginBottom:"10px",border:"0.5px solid #e0dbd5",cursor:"pointer",transition:"all 0.15s"}}
                  onMouseOver={e=>e.currentTarget.style.border="0.5px solid "+G}
                  onMouseOut={e=>e.currentTarget.style.border="0.5px solid #e0dbd5"}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"8px"}}>
                    <div style={{flex:1}} onClick={()=>{setConcepts([s.concept]);setPhase("results");setShowLibrary(false);}}>
                      <p style={{margin:"0 0 2px",fontSize:"14px",fontWeight:"800",color:"#1a1a1a",fontFamily:"'Nunito',sans-serif"}}>{s.title}</p>
                      {s.tagline&&<p style={{margin:0,fontSize:"12px",color:"#666",fontFamily:"'Nunito',sans-serif",fontStyle:"italic"}}>{s.tagline}</p>}
                      <p style={{margin:"4px 0 0",fontSize:"10px",color:G,fontFamily:"'Nunito',sans-serif",fontWeight:"600"}}>{T("Klik om te openen","Click to open",lang)} →</p>
                    </div>
                    <button onClick={e=>{e.stopPropagation();removeSaved(s.id);}} style={{background:"none",border:"none",color:"#ccc",cursor:"pointer",fontSize:"20px",padding:"0 0 0 8px",lineHeight:1,flexShrink:0}}>×</button>
                  </div>
                  <p style={{margin:0,fontSize:"10px",color:"#bbb",fontFamily:"'Nunito',sans-serif"}}>Opgeslagen op {s.savedAt}</p>
                </div>
              ))
            )}
          </div>
          {savedConcepts.length>0&&(
            <div style={{padding:"16px",borderTop:"0.5px solid #e8e4df"}}>
              <button onClick={()=>{if(confirm("Weet je zeker dat je alle opgeslagen concepten wilt verwijderen?")){setSavedConcepts([]);localStorage.removeItem("plukon_saved_concepts");setShowLibrary(false);}}} style={{width:"100%",padding:"10px",background:"#fff",border:"1px solid #ffcccc",color:"#cc0000",borderRadius:"8px",cursor:"pointer",fontSize:"13px",fontWeight:"600",fontFamily:"'Nunito',sans-serif"}}>
                Alle concepten verwijderen
              </button>
            </div>
          )}
        </div>
      )}

      {/* MAIN */}
      <div style={{marginLeft:"232px",flex:1,display:"flex",flexDirection:"column",minHeight:"100vh"}}>

        {/* Top bar for steps */}
        {phase==="steps"&&(
          <div style={{background:"#fff",borderBottom:"0.5px solid #e8e4df",padding:"0 32px",height:"56px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50}} className="no-print">
            <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
              <div style={{fontSize:"15px",fontWeight:"800",color:"#1a1a1a",fontFamily:"'Nunito',sans-serif"}}>{activeSteps[step]?.label}</div>
              <span style={{background:"#f0f0f0",color:"#888",fontSize:"11px",fontWeight:"700",padding:"3px 10px",borderRadius:"20px",fontFamily:"'Nunito',sans-serif"}}>{T("Stap","Step",lang)+" "+(step+1)+" / "+activeSteps.length}</span>
            </div>
            <div style={{display:"flex",gap:"5px"}}>
              {activeSteps.map((s,i)=><div key={s.id} style={{width:"28px",height:"4px",borderRadius:"2px",background:done.includes(s.id)?G:i===step?O:"#e0dbd5",transition:"all 0.3s"}}/>)}
            </div>
          </div>
        )}

        {/* Content */}
        <div style={{flex:1,padding:"32px"}}>

          {phase==="steps"&&(
            <div style={{maxWidth:"680px",animation:"slideIn 0.3s ease"}}>
              <div style={{background:"#fff",borderRadius:"16px",padding:"28px",border:"0.5px solid #e8e4df",marginBottom:"16px"}}>
                {stepContent()}
              </div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <button onClick={goBack} disabled={step===0} style={{padding:"10px 22px",background:"#fff",border:"0.5px solid #ddd",color:step===0?"#ccc":"#555",borderRadius:"10px",cursor:step===0?"default":"pointer",fontSize:"13px",fontWeight:"700",fontFamily:"'Nunito',sans-serif"}}>{T("Vorige","Previous",lang)}</button>
                <button onClick={advance} style={{padding:"11px 28px",background:O,color:"#fff",border:"none",borderRadius:"10px",cursor:"pointer",fontSize:"14px",fontWeight:"900",fontFamily:"'Nunito',sans-serif",boxShadow:"0 4px 12px rgba(245,124,0,0.3)"}}>{step<activeSteps.length-1?T("Volgende","Next",lang):T("Naar overzicht","To overview",lang)}</button>
              </div>
            </div>
          )}

          {phase==="summary"&&(
            <div style={{maxWidth:"680px",animation:"slideIn 0.3s ease"}}>
              <div style={{background:"#fff",borderRadius:"16px",padding:"28px",border:"0.5px solid #e8e4df",marginBottom:"16px"}}>
                <h2 style={{margin:"0 0 6px",fontWeight:"900",fontSize:"22px",color:"#1a1a1a",fontFamily:"'Nunito',sans-serif"}}>{T("Briefing overzicht","Briefing overview",lang)}</h2>
                <div style={{height:"3px",background:"linear-gradient(90deg,"+O+","+G+",transparent)",borderRadius:"2px",marginBottom:"24px"}}/>
                <div style={{display:"flex",flexDirection:"column",gap:"5px",marginBottom:"24px"}}>
                  {summaryRows.map(([label,value])=>(
                    <div key={label} style={{display:"flex",gap:"12px",padding:"8px 14px",background:SAND,borderRadius:"8px"}}>
                      <span style={{color:"#888",fontSize:"12px",minWidth:"130px",fontWeight:"600",fontFamily:"'Nunito',sans-serif"}}>{label}</span>
                      <span style={{color:"#333",fontSize:"12px",fontWeight:"600",flex:1,fontFamily:"'Nunito',sans-serif"}}>{value}</span>
                    </div>
                  ))}
                </div>
                <div style={{display:"flex",gap:"10px",flexWrap:"wrap"}}>
                  <button onClick={generate} style={{background:G,color:"#fff",border:"none",padding:"13px 26px",borderRadius:"10px",cursor:"pointer",fontSize:"14px",fontWeight:"900",fontFamily:"'Nunito',sans-serif",boxShadow:"0 4px 16px rgba(0,140,52,0.3)"}}>{T("Genereer ideeën","Generate ideas",lang)}</button>
                  <button onClick={()=>{setPhase("steps");setStep(activeSteps.length-1);}} style={{background:"#fff",border:"0.5px solid #ddd",color:"#555",padding:"13px 18px",borderRadius:"10px",cursor:"pointer",fontSize:"13px",fontWeight:"600",fontFamily:"'Nunito',sans-serif"}}>{T("Aanpassen","Adjust",lang)}</button>
                </div>
              </div>
            </div>
          )}

          {phase==="generating"&&(
            <div style={{maxWidth:"680px",animation:"fadeUp 0.3s ease"}}>
              <div style={{background:"#fff",borderRadius:"16px",padding:"60px 40px",textAlign:"center",border:"0.5px solid #e8e4df"}}>
                <div style={{position:"relative",width:"80px",height:"80px",margin:"0 auto 28px"}}>
                  <div style={{position:"absolute",inset:0,borderRadius:"50%",border:"3px solid #e0f0e0",borderTop:"3px solid "+G,animation:"spin 1.2s linear infinite"}}/>
                  <div style={{position:"absolute",inset:"10px",borderRadius:"50%",border:"3px solid #fff3e0",borderBottom:"3px solid "+O,animation:"spin 0.8s linear infinite reverse"}}/>
                  <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"28px"}}>⚡</div>
                </div>
                <h2 style={{fontWeight:"900",fontSize:"22px",color:"#1a1a1a",margin:"0 0 12px",fontFamily:"'Nunito',sans-serif"}}>{T("De Engine werkt aan je ideeën...","The Engine is working on your ideas...",lang)}</h2>
                <RotatingFact lang={lang}/>
                <div style={{height:"4px",background:"#f0f0f0",borderRadius:"2px",overflow:"hidden",maxWidth:"280px",margin:"24px auto 0"}}>
                  <div style={{height:"100%",width:"60%",background:"linear-gradient(90deg,"+G+","+O+")",borderRadius:"2px",animation:"shimmer 1.8s ease-in-out infinite"}}/>
                </div>
              </div>
            </div>
          )}

          {phase==="results"&&(
            <div style={{maxWidth:"760px",animation:"fadeUp 0.3s ease"}}>
              <div style={{marginBottom:"24px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:"12px"}}>
                <div>
                  <h2 style={{fontWeight:"900",fontSize:"26px",color:"#1a1a1a",margin:"0 0 4px",fontFamily:"'Nunito',sans-serif"}}>{concepts.length>0?(concepts.length+" "+T("Productideeën","Product ideas",lang)):T("Generatie voltooid","Generation complete",lang)}</h2>
                  <p style={{color:"#888",fontSize:"13px",fontFamily:"'Nunito',sans-serif"}}>{[form.category,form.gevSegment||form.convSegment||form.compSegment,...form.retailer,...form.country].filter(Boolean).join(" · ")||"Plukon NPD 2026"}</p>
                </div>
                <div style={{display:"flex",gap:"8px"}}>
                  <button onClick={generate} style={{background:"#fff",border:"0.5px solid "+G,color:G,padding:"9px 18px",borderRadius:"8px",cursor:"pointer",fontSize:"13px",fontWeight:"700",fontFamily:"'Nunito',sans-serif"}}>{T("Nieuwe variatie","New variation",lang)}</button>
                  <button onClick={()=>setPhase("summary")} style={{background:"#fff",border:"0.5px solid #ddd",color:"#555",padding:"9px 18px",borderRadius:"8px",cursor:"pointer",fontSize:"13px",fontWeight:"600",fontFamily:"'Nunito',sans-serif"}}>{T("Aanpassen","Adjust",lang)}</button>
                </div>
              </div>
              {apiLog&&<div style={{background:OL,border:"0.5px solid "+O,borderRadius:"10px",padding:"14px 16px",marginBottom:"20px"}}><p style={{margin:0,fontSize:"12px",color:"#555",fontFamily:"monospace",whiteSpace:"pre-wrap"}}>{apiLog}</p></div>}
              {concepts.map((c,i)=>
                (conceptMode==="improve"||conceptMode==="tasting")
                  ?<ImprovementCard key={i} concept={c} index={i} lang={lang} saved={!!savedConcepts.find(s=>s.concept===c)} onSave={saveConcept}/>
                  :<ConceptCard key={i} concept={c} index={i} lang={lang} saved={!!savedConcepts.find(s=>s.concept===c)} onSave={saveConcept} developing={developing&&developingIndex===i} isAH={isAH} onDevelop={(concept,feedback)=>developFurther(concept,feedback,i)}/>
              )}
              {savedConcepts.length>0&&(
                <div style={{background:"#fff",borderRadius:"14px",padding:"20px",border:"1.5px solid "+G,marginTop:"8px"}}>
                  <p style={{margin:"0 0 12px",fontSize:"13px",fontWeight:"900",color:G,fontFamily:"'Nunito',sans-serif",textTransform:"uppercase",letterSpacing:"0.06em"}}>{"Opgeslagen ("+savedConcepts.length+")"}</p>
                  {savedConcepts.map((s)=>(
                    <div key={s.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 12px",background:SAND,borderRadius:"8px",marginBottom:"6px"}}>
                      <div>
                        <p style={{margin:0,fontSize:"13px",fontWeight:"700",color:"#333",fontFamily:"'Nunito',sans-serif"}}>{s.title}</p>
                        {s.tagline&&<p style={{margin:0,fontSize:"11px",color:"#888",fontFamily:"'Nunito',sans-serif",fontStyle:"italic"}}>{s.tagline}</p>}
                        <p style={{margin:0,fontSize:"10px",color:"#bbb",fontFamily:"'Nunito',sans-serif"}}>{s.savedAt}</p>
                      </div>
                      <button onClick={()=>removeSaved(s.id)} style={{background:"none",border:"none",color:"#ccc",cursor:"pointer",fontSize:"20px",padding:"0 4px",lineHeight:1}}>×</button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

        </div>
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<InnovationEngine/>);
</script>
</body>
</html>
